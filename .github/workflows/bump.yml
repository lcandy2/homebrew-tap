name: Bump formula

# Called from a project's release workflow to point one of this tap's
# formulas at a new download:
#
#   tap:
#     uses: lcandy2/homebrew-tap/.github/workflows/bump.yml@main
#     with:
#       formula: sim-agentation
#       url: https://github.com/lcandy2/sim-agentation/releases/download/0.2.2/sim-agentation-0.2.2-macos-arm64.tar.gz
#     secrets:
#       app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
#
# It writes as the "lcandy2's homebrew tap" GitHub App, with a token minted
# for the run alone and scoped to this repository. The caller holds the
# app's private key as a secret; the app's ID is below.

on:
  workflow_call:
    inputs:
      formula:
        description: The formula's name, as in Formula/<name>.rb
        required: true
        type: string
      url:
        description: The new download (https)
        required: true
        type: string
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read

env:
  APP_ID: 5202405
  BOT_NAME: lcandy2-s-homebrew-tap[bot]
  BOT_EMAIL: 338305349+lcandy2-s-homebrew-tap[bot]@users.noreply.github.com

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      FORMULA: ${{ inputs.formula }}
      URL: ${{ inputs.url }}
    steps:
      - name: Check the inputs
        run: |
          echo "$FORMULA" | grep -Eq '^[a-z0-9][a-z0-9@.+-]*$' || { echo "Not a formula name: $FORMULA"; exit 1; }
          echo "$URL" | grep -Eq '^https://[^[:space:]"]+$' || { echo "Not an https URL: $URL"; exit 1; }
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: lcandy2
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v5
        with:
          repository: lcandy2/homebrew-tap
          persist-credentials: false
      - name: Point the formula at the download
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          file="Formula/$FORMULA.rb"
          test -f "$file" || { echo "No $file in the tap"; exit 1; }
          curl -fsSL "$URL" -o "$RUNNER_TEMP/download"
          sha=$(sha256sum "$RUNNER_TEMP/download" | cut -d' ' -f1)
          sed -i -E -e "s|^  url \".*\"|  url \"$URL\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$file"
          if git diff --quiet; then echo "$FORMULA is at that download already"; exit 0; fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -am "$FORMULA: $(basename "$URL")"
          # The token reaches git for this push alone.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push
